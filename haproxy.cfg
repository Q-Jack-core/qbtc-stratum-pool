global
    maxconn 100000

defaults
    mode tcp
    timeout connect 5s
    timeout client 30m
    timeout server 30m

frontend stratum_gateway
    bind *:3333
    mode tcp
    stick-table type ip size 100k expire 30s store conn_rate(3s)
    tcp-request connection track-sc0 src
    tcp-request connection reject if { sc_conn_rate(0) -gt 20 }
    default_backend stratum_pool

backend stratum_pool
    mode tcp
    balance roundrobin
    server rust_pool_1 127.0.0.1:3334 check
